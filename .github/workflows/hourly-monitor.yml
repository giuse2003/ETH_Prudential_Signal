name: ETH-USD Signal monitor

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eth-usd-signal-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state
            data/ETH-USD_coinbase_daily.csv
          key: eth-state-${{ github.run_id }}
          restore-keys: |
            eth-state-

      - name: Install locked environment
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python hourly_monitor.py

      - name: Publish coherent dashboard bundle
        run: |
          mkdir -p docs
          cp reports/status.json docs/status.json
          cp reports/chart-data.json docs/chart-data.json
          cp reports/live-status.json docs/live-status.json
          cp reports/raw_candles.csv docs/raw_candles.csv
          cp reports/historical_signals.csv docs/historical_signals.csv
          cp reports/equity_timeseries.csv docs/equity_timeseries.csv
          cp reports/report.txt docs/report.txt
          cp reports/price_sma_signals.png docs/price_sma_signals.png
          cp reports/manifest.json docs/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/chart-data.json docs/live-status.json docs/raw_candles.csv docs/historical_signals.csv docs/equity_timeseries.csv docs/report.txt docs/price_sma_signals.png docs/manifest.json
          git diff --cached --quiet || git commit -m "Aggiorna pacchetto ETH-USD Signal"
          git push

      - name: Save monitor state
        uses: actions/cache/save@v4
        with:
          path: |
            .state
            data/ETH-USD_coinbase_daily.csv
          key: eth-state-${{ github.run_id }}
